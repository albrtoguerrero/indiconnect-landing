<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Bitácora de prompts del equipo: cada petición hecha a la IA para construir el proyecto, filtrable por autor y por entregable. Proyecto académico ficticio.">
  <meta name="theme-color" content="#0b6e80" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1b20" media="(prefers-color-scheme: dark)">
  <title>Bitácora de prompts · IndiConnect</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="bitacora.css">
  <script src="../js/lang.js"></script>
  <script src="bitacora.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" id="lg-skip">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../"><span class="brand-dot" aria-hidden="true"></span><span>IndiConnect</span></a>
      <a class="log-back" href="../#uso-ia" id="lg-back">Volver a la documentación</a>
      <button type="button" class="theme-toggle lang-toggle" id="lang-toggle">English</button>
      <button type="button" class="theme-toggle" id="theme-toggle">Modo oscuro</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="part--log">
      <div class="container">
        <p class="eyebrow" id="lg-eyebrow">Registro de trabajo</p>
        <h1 class="log-h1" id="lg-title">Bitácora de prompts</h1>
        <p class="lead" id="lg-intro"></p>
        <dl class="log-stats" id="lg-stats"></dl>
        <div class="log-tools">
          <label class="sr-only" for="lg-q" id="lg-qlabel">Buscar</label>
          <input type="search" id="lg-q" autocomplete="off">
          <div class="log-dl">
            <button type="button" class="log-btn" id="lg-share">Copiar enlace a esta vista</button>
            <button type="button" class="log-btn" id="lg-csv">CSV</button>
          </div>
        </div>
        <div class="log-filters">
          <div class="log-chips" id="lg-authors" role="group" aria-label="Autor"></div>
          <div class="log-chips" id="lg-chips" role="group" aria-label="Entregable"></div>
        </div>
        <p class="log-count" id="lg-count" aria-live="polite"></p>
        <div id="lg-list" class="log-list"></div>
        <p class="log-note" id="lg-note"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="legal" id="lg-legal">Proyecto académico ficticio, sin vinculación con Inditex ni con ninguna otra empresa o marca real. Equipo: Alberto Guerrero, Lucía Guerra y Mikel Moriel.</p>
    </div>
  </footer>
</body>
</html>
