name: Sync Asana progress

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-asana
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch progress from Asana
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
        run: node tools/sync-asana.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/asana.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/asana.json
            git commit -m "chore: sync Asana progress"
            git push
          fi
